# **Included in every `location` that sets a header of its own, and that is not
# belt and braces.**
#
# nginx inherits `add_header` from an enclosing block **only while the inner
# block declares none of its own**. One `add_header Cache-Control` inside a
# `location` therefore drops every header the `server` block set — silently, with
# no warning and nothing in the configuration to suggest it. Measured 2026-08-30:
# with these five declared only at server level, `/en/` carried all of them and
# `/_next/static/…` carried none, so every script and stylesheet on the site was
# served outside the policy and with sniffing enabled.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# **A real policy, which the application cannot have.** `AlgoJudge-Client` writes
# its runtime configuration into `index.html` as an inline script, so a policy
# worth having there needs a nonce it does not emit. A static documentation site
# has no such constraint, so it carries one.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
