# The whole site, served as files.
#
# **No upstream, no proxy, no runtime.** That is the point of a static export:
# there is nothing here that can be slow, crash, or hold a connection open.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # **Plain HTTP, and that is deliberate.** The host this runs on terminates
    # TLS, the same arrangement the `algojudge-client` image uses. An image that
    # wanted a certificate would need one baked in or mounted, and this one is
    # published to a registry.
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    # `trailingSlash: true`, so every page is `<path>/index.html` and every
    # address ends in a slash. Without this, `/en/install` 404s and `/en/install/`
    # works, which is the kind of difference nobody spots in a link.
    location / {
        include /etc/nginx/security-headers.conf;

        # **HTML must be revalidated or a deployment is invisible.** With no
        # `Cache-Control` at all, a browser applies heuristic freshness — a tenth
        # of the document's age — so a page last changed a month ago is served
        # from cache for days. A reader would keep following an installation
        # procedure that has since been corrected, which is the one harm this
        # site's retention policy exists to prevent.
        add_header Cache-Control "no-cache" always;

        try_files $uri $uri/ $uri/index.html =404;
    }

    # The export writes its own 404 page; without this nginx serves its stock one.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # The search indexes: one extensionless file per locale, written by the
    # build. Without the type they are served as downloads rather than read.
    location /api/search/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
    }

    # Content-hashed by the build, so it can be cached for as long as anybody
    # likes. **One directive, not two**: `expires` and `add_header Cache-Control`
    # both emit the field, and a response carrying two of them is one an
    # intermediary may read either way — measured, the pair produced
    # `max-age=31536000` followed by `public, immutable`, so a cache taking the
    # first lost the `immutable` this block exists to set.
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    include /etc/nginx/redirects.conf;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    server_tokens off;
}
