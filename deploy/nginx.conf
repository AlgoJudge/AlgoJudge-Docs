# The whole site, served as files.
#
# **No upstream, no proxy, no runtime.** That is the point of a static export:
# there is nothing here that can be slow, crash, or hold a connection open.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # **Plain HTTP, and that is deliberate.** The host this runs on terminates
    # TLS, the same arrangement the `algojudge-client` image uses. An image that
    # wanted a certificate would need one baked in or mounted, and this one is
    # published to a registry.
    absolute_redirect off;

    # `trailingSlash: true`, so every page is `<path>/index.html` and every
    # address ends in a slash. Without this, `/en/install` 404s and `/en/install/`
    # works, which is the kind of difference nobody spots in a link.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # The search index: one extensionless file written by the build. Without the
    # type it is served as a download rather than read.
    location = /api/search {
        default_type application/json;
    }

    # Content-hashed by the build, so it can be cached for as long as anybody
    # likes. Everything else must be revalidated or a deployment is invisible.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The export writes its own 404 page; without this nginx serves its stock one.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # **Not under `conf.d/`, and that is the whole reason for the path.** The
    # base image's `nginx.conf` does `include /etc/nginx/conf.d/*.conf` in the
    # `http` context, so a file of `location` rules left there is loaded twice —
    # once here, correctly, and once at `http` level, where `location` is not
    # allowed and nginx refuses to start.
    include /etc/nginx/redirects.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # **A real policy, which the application cannot have.** `AlgoJudge-Client`
    # writes its runtime configuration into `index.html` as an inline script, so
    # a policy worth having there needs a nonce it does not emit. A static
    # documentation site has no such constraint, so it carries one.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    server_tokens off;
}
